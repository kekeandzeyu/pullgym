[project]
name = "pullgym"
version = "0.1.0.dev0"
description = "An agent environment that scores honest error bars on simulated physics measurements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
pullgym = "pullgym.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pullgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: many-seed calibration checks"]
